<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Эволюция: Автобатл · Ряды · Сложность 3/10</title>
<style>
  :root{
    --accent:#ffd97a; --text:#f4ecd8; --muted:#b9a97f;
    --panel:rgba(0,0,0,.28); --line:rgba(255,255,255,.16);
    --good:#7ee07e; --bad:#ff7e7e;
    --frontBg:rgba(255,180,60,.18); --frontLine:#ffb03a;
    --backBg:rgba(120,180,255,.16); --backLine:#7ec8ff;
    --crit:#ff7043; --heal:#7ee07e; --block:#7ec8ff; --vamp:#d44040; --chain:#ba68c8; --shield:#4dd0e1;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:'Segoe UI',Roboto,Arial,sans-serif; color:var(--text);
    background:linear-gradient(135deg,#3a1d0f,#7a3b1e) fixed; min-height:100vh; padding:16px; transition:background .8s;
  }
  .wrap{max-width:980px; margin:0 auto}
  h1{font-size:25px; color:var(--accent); text-shadow:0 2px 6px rgba(0,0,0,.4)}
  .sub{color:var(--muted); font-size:14px; margin:4px 0 14px}
  .topbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
  .stat{padding:8px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--line); font-size:14px}
  .stat b{color:var(--accent)}
  .era-chip{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:5px 11px; border-radius:20px; background:var(--panel); border:1px solid var(--line)}
  .card{background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px}
  .card h2{font-size:16px; margin-bottom:10px; color:var(--accent)}
  .btn{padding:9px 18px; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; color:#3a1d0f; background:linear-gradient(135deg,#ffd97a,#ffb03a); transition:.15s}
  .btn:hover{transform:translateY(-1px); filter:brightness(1.05)}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
  .btn.ghost{background:rgba(255,255,255,.12); color:var(--text)}
  .btn.blue{background:linear-gradient(135deg,#7ec8ff,#4aa8ff); color:#0f2a3a}
  .row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px}
  .shop{display:flex; gap:12px; flex-wrap:wrap}
  .sCard{width:150px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; animation:pop .3s ease}
  .sCard .e{font-size:36px; text-align:center}
  .sCard .n{font-weight:700; text-align:center; margin:4px 0; font-size:13px}
  .sCard .i{font-size:11px; color:var(--muted); text-align:center}
  .sCard .btn{margin:8px auto 0; display:block; font-size:12px; padding:7px 10px}
  .ab-badge{display:inline-block; padding:1px 6px; border-radius:8px; font-size:10px; font-weight:600; margin-top:3px}
  .slotarea .rowlabel{font-size:12px; color:var(--muted); margin:8px 0 4px; font-weight:600}
  .slots{display:flex; gap:8px; flex-wrap:wrap}
  .slot{width:120px; min-height:96px; border-radius:12px; padding:8px; position:relative; border:1px dashed}
  .slot.front{background:var(--frontBg); border-color:var(--frontLine)}
  .slot.back{background:var(--backBg); border-color:var(--backLine)}
  .slot.empty-front{background:rgba(255,180,60,.06); border-color:rgba(255,176,58,.4)}
  .slot.empty-back{background:rgba(120,180,255,.05); border-color:rgba(126,200,255,.4)}
  .slot .e{font-size:26px}
  .slot .n{font-size:11px; font-weight:600}
  .slot .ab{font-size:10px}
  .slot .mini{position:absolute; top:4px; right:4px; display:flex; gap:3px}
  .slot .mini button{background:rgba(0,0,0,.5); border:1px solid var(--line); color:var(--text); border-radius:6px; cursor:pointer; font-size:10px; padding:1px 5px}
  .bonus-badge{position:absolute; bottom:4px; left:6px; font-size:9px; color:var(--backLine); font-weight:700}
  .arena{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .side{padding:12px; border-radius:14px; background:var(--panel); border:1px solid var(--line); min-height:110px}
  .side h3{font-size:13px; margin-bottom:8px; color:var(--muted)}
  .funit{display:flex; align-items:center; gap:8px; padding:5px; border-radius:10px; margin-bottom:6px; background:rgba(0,0,0,.25); position:relative; animation:pop .3s ease}
  .funit .e{font-size:24px; animation:bob 2.2s infinite}
  .funit .rowtag{font-size:9px; position:absolute; top:2px; right:4px; opacity:.7}
  .bar{height:8px; border-radius:6px; background:rgba(0,0,0,.4); overflow:hidden; flex:1; margin-top:2px}
  .bar>div{height:100%; width:100%; border-radius:6px; transition:width .15s; background:linear-gradient(90deg,#7ee07e,#3fae3f)}
  .bar.red>div{background:linear-gradient(90deg,#ff7e7e,#d44040)}
  .hpnum{font-size:10px; color:var(--muted); min-width:30px; text-align:right}
  .shield-ind{position:absolute; left:6px; bottom:6px; font-size:11px; color:var(--shield); opacity:.9}
  .log{background:rgba(0,0,0,.35); border:1px solid var(--line); border-radius:14px; padding:12px; height:150px; overflow-y:auto; font-size:12px; line-height:1.6; margin-top:12px}
  .log p{margin:0}
  .hit{color:#ffe08a} .crit{color:var(--crit); font-weight:700} .heal{color:var(--heal)}
  .vamp{color:#ff9a9a} .chain{color:var(--chain)} .shield{color:var(--shield)}
  .banner{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(20,14,6,.85); z-index:50}
  .banner .box{max-width:380px; text-align:center; padding:26px; background:var(--panel); border:1px solid var(--line); border-radius:18px}
  .banner .big{font-size:52px; animation:bob 1.5s infinite}
  .banner h2{margin:10px 0; font-size:23px; color:var(--accent)}
  .banner p{color:var(--muted); margin-bottom:14px}
  .hidden{display:none!important}
  .pulse{animation:pulse .5s ease}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes pop{0%{transform:scale(.5); opacity:0}100%{transform:scale(1); opacity:1}}
  @keyframes pulse{0%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 14px rgba(255,255,255,.6)}100%{box-shadow:0 0 0 rgba(255,255,255,0)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚔️ Эволюция: Автобатл</h1>
  <div class="sub">Покупай воинов, расставляй их по рядам, пройди 3 эпохи. Сложность 3/10.</div>

  <div class="topbar">
    <div class="stat">💰 Золото: <b id="gold">40</b></div>
    <div class="stat">🌊 Волна: <b id="wave">1</b>/12</div>
    <div class="era-chip" id="eraChip">🏛 Древний мир</div>
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">🛒 Лавка</h2>
      <button class="btn ghost" id="btnReroll">🔁 Переролл · 1💰</button>
    </div>
    <div class="shop" id="shop"></div>
  </div>

  <div class="card slotarea">
    <h2>🛡 Твоя армия <span style="font-weight:400;color:var(--muted);font-size:12px">(<span id="armySize">0</span>/5)</span></h2>
    <div class="rowlabel" style="color:var(--frontLine)">🛡 Передний ряд — принимает урон</div>
    <div class="slots" id="front"></div>
    <div class="rowlabel" style="color:var(--backLine)">🏹 Задний ряд — +15% атаки</div>
    <div class="slots" id="back"></div>
  </div>

  <div class="card">
    <h2>⚔️ Битва</h2>
    <div class="arena">
      <div class="side"><h3>Твоя армия</h3><div id="pSide"></div></div>
      <div class="side"><h3>Враги</h3><div id="eSide"></div></div>
    </div>
    <div style="display:flex; justify-content:center; margin-top:12px">
      <button class="btn blue" id="btnBattle">⚔️ Начать битву</button>
    </div>
    <div class="log" id="log"><p style="opacity:.6">Здесь пойдёт лента боя…</p></div>
  </div>
</div>

<div class="banner hidden" id="banner">
  <div class="box">
    <div class="big" id="bEmoji">🏆</div>
    <h2 id="bTitle">Победа!</h2>
    <p id="bText"></p>
    <button class="btn" id="bBtn">Следующая волна →</button>
  </div>
</div>

<script>
// ============ ДАННЫЕ ============
const ERAS = [
  {name:'Древний мир', emoji:'🏛', grad:['#3a1d0f','#7a3b1e'], mult:1.0},
  {name:'Средневековье', emoji:'🏰', grad:['#241a2a','#4a3a4a'], mult:1.5},
  {name:'Ренессанс', emoji:'🎨', grad:['#0f2a3a','#1f4a5e'], mult:2.2},
];
const ERAS_PER = 4;
const MAX_WAVE = 12;
const FRONT_MAX = 3, BACK_MAX = 2, MAX_ARMY = 5;

// способности и их цвета/иконки
const AB = {
  none:   {n:'Обычный',    e:'',      c:'#888'},
  crit:   {n:'Крит',       e:'🎯',    c:'#ff7043'},
  heal:   {n:'Лечение',    e:'💚',    c:'#7ee07e'},
  block:  {n:'Блок',       e:'🛡️',   c:'#7ec8ff'},
  vamp:   {n:'Вампиризм',  e:'🩸',    c:'#d44040'},
  chain:  {n:'Цепной урон',e:'🛰️',   c:'#ba68c8'},
  shield: {n:'Щит',        e:'✨',    c:'#4dd0e1'},
};

// юниты: 3 эпохи по 6
const UNITS = [
  // Древний мир
  {e:0,emoji:'🗡️',name:'Воин',      hp:42,atk:10,spd:5, ab:'none',  cost:18},
  {e:0,emoji:'🏹',name:'Лучник',    hp:26,atk:13,spd:8, ab:'crit',  cost:22},
  {e:0,emoji:'🛡️',name:'Копейщик', hp:58,atk:8, spd:4, ab:'block', cost:24},
  {e:0,emoji:'🐎',name:'Всадник',   hp:32,atk:12,spd:9, ab:'none',  cost:24},
  {e:0,emoji:'⛪',name:'Жрец',      hp:28,atk:6, spd:5, ab:'heal',  cost:28},
  {e:0,emoji:'🩸',name:'Берсерк',   hp:46,atk:14,spd:6, ab:'vamp',  cost:34},
  // Средневековье
  {e:1,emoji:'⚔️',name:'Мечник',    hp:50,atk:13,spd:6, ab:'none',  cost:32},
  {e:1,emoji:'🛡️',name:'Рыцарь',    hp:66,atk:11,spd:4, ab:'block', cost:38},
  {e:1,emoji:'🎯',name:'Арбалетчик',hp:32,atk:18,spd:5, ab:'crit',  cost:40},
  {e:1,emoji:'⚕️',name:'Монах',     hp:34,atk:8, spd:5, ab:'heal',  cost:38},
  {e:1,emoji:'🔮',name:'Рыцарь-маг',hp:36,atk:16,spd:6, ab:'chain', cost:44},
  {e:1,emoji:'🥷',name:'Ассасин',   hp:34,atk:20,spd:9, ab:'crit',  cost:46},
  // Ренессанс
  {e:2,emoji:'🔫',name:'Мушкетёр',   hp:40,atk:24,spd:5, ab:'crit',  cost:54},
  {e:2,emoji:'⚔️',name:'Конкистадор',hp:56,atk:18,spd:6, ab:'block', cost:52},
  {e:2,emoji:'⚗️',name:'Алхимик',    hp:42,atk:12,spd:6, ab:'heal',  cost:56},
  {e:2,emoji:'🎇',name:'Артиллерист',hp:40,atk:20,spd:4, ab:'chain', cost:56},
  {e:2,emoji:'✨',name:'Чародей',    hp:44,atk:16,spd:6, ab:'shield',cost:58},
  {e:2,emoji:'🩸',name:'Канонир',    hp:50,atk:22,spd:5, ab:'vamp',  cost:60},
];

function eraOf(w){ return Math.min(ERAS.length-1, Math.floor((w-1)/ERAS_PER)); }
function statsOf(u,mult){ return {hp:Math.round(u.hp*mult), atk:Math.round(u.atk*mult)}; }
const BACK_BONUS = 1.15;

// ============ СОСТОЯНИЕ (без сохранения) ============
let S = {gold:40, wave:1, army:[], shop:[]};
function freshShop(){
  const era=eraOf(S.wave);
  const pool=UNITS.filter(u=>u.e===era);
  const s=[]; for(let i=0;i<3;i++) s.push(pool[Math.floor(Math.random()*pool.length)]);
  return s;
}
S.shop = freshShop();

// ============ РЕНДЕР ============
const $ = id => document.getElementById(id);
function logLine(html,cls){ const l=$('log'); const p=document.createElement('p'); p.innerHTML=html; if(cls)p.className=cls; l.appendChild(p); l.scrollTop=l.scrollHeight; }

function render(){
  const era=eraOf(S.wave);
  $('gold').textContent=S.gold;
  $('wave').textContent=S.wave;
  $('armySize').textContent=S.army.length;
  $('eraChip').innerHTML=ERAS[era].emoji+' '+ERAS[era].name;
  document.body.style.background='linear-gradient(135deg,'+ERAS[era].grad[0]+','+ERAS[era].grad[1]+') fixed';
  renderShop(); renderArmy();
  $('banner').classList.add('hidden');
}
function abBadge(ab){
  const a=AB[ab]||AB.none;
  return a.e?`<span class="ab-badge" style="background:${a.c}22;color:${a.c};border:1px solid ${a.c}66">${a.e} ${a.n}</span>`:'';
}
function renderShop(){
  const box=$('shop'); box.innerHTML='';
  S.shop.forEach((u,i)=>{
    const d=document.createElement('div'); d.className='sCard';
    d.innerHTML=`<div class="e">${u.emoji}</div><div class="n">${u.name}</div>
      <div class="i">❤️${u.hp} ⚔️${u.atk} 💨${u.spd}</div>
      <div style="text-align:center">${abBadge(u.ab)}</div>
      <button class="btn" data-si="${i}">Купить · ${u.cost}💰</button>`;
    d.querySelector('[data-si]').addEventListener('click',()=>buy(i));
    box.appendChild(d);
  });
}
function renderArmy(){
  const f=$('front'), b=$('back'); f.innerHTML=''; b.innerHTML='';
  for(let i=0;i<FRONT_MAX;i++){ f.appendChild(slotEl(S.army.filter(x=>x.row==='front')[i],'front')); }
  for(let i=0;i<BACK_MAX;i++){ b.appendChild(slotEl(S.army.filter(x=>x.row==='back')[i],'back')); }
}
function slotEl(u,row){
  const d=document.createElement('div');
  d.className='slot '+(u?(row):('empty-'+row));
  if(u){
    d.innerHTML=`<div class="e">${u.emoji}</div><div class="n">${u.name}</div>
      <div class="ab">${abBadge(u.ab)}</div>
      <span class="mini">
        <button data-m="${u.uid}" title="Сменить ряд">⇅</button>
        <button data-x="${u.uid}" title="Продать">✖</button>
      </span>
      ${row==='back'?'<span class="bonus-badge">+15% ⚔️</span>':''}`;
    d.querySelector('[data-m]').addEventListener('click',()=>moveRow(u.uid));
    d.querySelector('[data-x]').addEventListener('click',()=>sell(u.uid));
  } else {
    d.innerHTML='<div style="color:var(--muted);font-size:20px;opacity:.4;text-align:center">•</div>';
  }
  return d;
}

// ============ ДЕЙСТВИЯ ============
function buy(si){
  const u=S.shop[si];
  if(S.gold<u.cost){ logLine('Не хватает золота'); return; }
  if(S.army.length>=MAX_ARMY){ logLine('Армия полна!'); return; }
  S.gold-=u.cost;
  const row = S.army.filter(x=>x.row==='front').length<FRONT_MAX ? 'front' : 'back';
  S.army.push({name:u.name, emoji:u.emoji, hp:u.hp, atk:u.atk, spd:u.spd, ab:u.ab, cost:u.cost, e:u.e, row, uid:'u'+Math.random().toString(36).slice(2,8)});
  logLine(`🛒 Куплен ${u.emoji} ${u.name} (${row==='front'?'передний':'задний'} ряд)`);
  render();
}
function sellUid(uid){
  const i=S.army.findIndex(x=>x.uid===uid); if(i<0) return;
  const u=S.army[i];
  S.gold+=Math.round(u.cost*0.5);
  S.army.splice(i,1);
  logLine(`💰 Продан ${u.emoji} ${u.name} (+${Math.round(u.cost*0.5)}💰)`);
  render();
}
function sell(uid){ sellUid(uid); }
function moveRow(uid){
  const u=S.army.find(x=>x.uid===uid); if(!u) return;
  const target = u.row==='front' ? 'back' : 'front';
  const lim = target==='front'?FRONT_MAX:BACK_MAX;
  if(S.army.filter(x=>x.row===target).length>=lim){ logLine('Этот ряд полон'); return; }
  u.row=target; logLine(`⇅ ${u.emoji} ${u.name} → ${target==='front'?'передний':'задний'} ряд`); render();
}
function reroll(){ if(S.gold<1){logLine('Мало золота');return;} S.gold-=1; S.shop=freshShop(); render(); }

// ============ БОЙ ============
let battling=false;
function makeEnemies(){
  const era=eraOf(S.wave), w=waveInEra(S.wave);
  const pool=UNITS.filter(u=>u.e===era);
  const n=Math.min(5, 2+Math.floor(w/2));
  const mult=(0.65+S.wave*0.11)*ERAS[era].mult;
  const isBoss=(w===4);
  const arr=[];
  for(let i=0;i<n;i++){
    const u=pool[Math.floor(Math.random()*pool.length)];
    const st=statsOf(u,mult);
    const boss=(isBoss&&i===0);
    arr.push({name:boss?'Вождь эпохи':u.name, emoji:boss?'👑':u.emoji, hp:boss?st.hp*1.6:st.hp, atk:boss?st.atk*1.4:st.atk, spd:u.spd, ab:u.ab, row:i<FRONT_MAX?'front':'back', side:'e', boss});
  }
  return arr;
}
function makePlayer(){
  return S.army.map(u=>({name:u.name,emoji:u.emoji,hp:u.hp,atk:u.atk,spd:u.spd,ab:u.ab,row:u.row,side:'p',boss:false}));
}
function initBattle(){
  if(S.army.length===0){ logLine('Сначала купи воинов в лавке!'); return; }
  if(battling) return;
  $('log').innerHTML='<p>Битва начинается…</p>';
  const p=makePlayer(), e=makeEnemies();
  // щит
  p.forEach(u=>{ if(u.ab==='shield'){ u.shield=Math.round(u.hp*0.3); } });
  e.forEach(u=>{ if(u.ab==='shield'){ u.shield=Math.round(u.hp*0.3); } });
  renderField(p,e);
  runBattle(p,e);
}
function renderField(p,e){
  $('pSide').innerHTML=''; $('eSide').innerHTML='';
  const ord=a=>[...a].sort((x,y)=>(x.row==='front'?0:1)-(y.row==='front'?0:1));
  ord(p).forEach(u=>$('pSide').appendChild(funit(u)));
  ord(e).forEach(u=>$('eSide').appendChild(funit(u)));
}
function funit(u){
  const d=document.createElement('div'); d.className='funit';
  const rowTag = u.row==='front'?'П':'З';
  d.innerHTML=`<span class="e">${u.emoji}${u.boss?'👑':''}</span>
    <div style="flex:1"><div style="font-size:12px">${u.name}</div>
      <div class="bar ${u.side==='e'?'red':''}"><div></div></div></div>
    <span class="hpnum"></span>
    ${u.shield?`<span class="shield-ind">✦${u.shield}</span>`:''}
    <span class="rowtag">${rowTag}</span>`;
  return d;
}
function syncHP(p,e){
  const sides={p:'pSide',e:'eSide'};
  ['p','e'].forEach(side=>{
    const arr=side==='p'?p:e; const cards=[...$(sides[side]).children];
    arr.forEach((u,i)=>{ const c=cards[i]; if(!c)return;
      c.querySelector('.bar>div').style.width=Math.max(0,u.hp/u.maxHp*100)+'%';
      c.querySelector('.hpnum').textContent=u.hp;
      if(u.hp<=0) c.style.opacity='0.4';
      const si=c.querySelector('.shield-ind');
      if(si) si.textContent='✦'+u.shield;
    });
  });
}
function pickTarget(enemy){
  const front=enemy.filter(u=>u.hp>0 && u.row==='front');
  if(front.length) return front[Math.floor(Math.random()*front.length)];
  const back=enemy.filter(u=>u.hp>0);
  return back[Math.floor(Math.random()*back.length)];
}
function dealDmg(tar,dmg){
  if(tar.shield>0){ const absorbed=Math.min(tar.shield,dmg); tar.shield-=absorbed; dmg-=absorbed; }
  tar.hp-=Math.max(0,dmg);
  return dmg;
}

async function runBattle(p,e){
  battling=true; $('btnBattle').disabled=true;
  const all=[...p,...e]; all.forEach(u=>{ u.maxHp=u.hp; u.next=100/u.spd; });
  syncHP(p,e);
  while(true){
    const pa=p.filter(u=>u.hp>0), ea=e.filter(u=>u.hp>0);
    if(pa.length===0||ea.length===0) break;
    const actor=[...pa,...ea].reduce((a,b)=>a.next<=b.next?a:b);
    actor.next+=100/actor.spd;
    await act(actor,p,e);
    syncHP(p,e);
  }
  battling=false; $('btnBattle').disabled=false;
  const win=p.some(u=>u.hp>0);
  if(win){
    const reward=12+S.wave*2;
    S.gold+=reward;
    logLine(`🏆 Победа! +${reward}💰`,'hit');
    if(S.wave>=MAX_WAVE) showBanner('🥇','Ты покорил все 3 эпохи!','Заново', true);
    else showBanner('🏆','Победа! +'+reward+'💰','Следующая волна →', false);
  } else {
    logLine('💀 Поражение… Попробуй другой состав и расстановку.','crit');
    showBanner('💀','Армия пала. Золото и войска сохранены.','Повторить волну', false);
  }
}
async function act(actor,p,e){
  const enemy=actor.side==='p'?e:p;
  const allies=actor.side==='p'?p:e;
  const u=actor;
  const backBonus = u.row==='back' ? BACK_BONUS : 1;
  const atk=Math.round(u.atk*backBonus);
  if(u.ab==='heal'){
    const hurt=allies.filter(a=>a.hp>0 && a.hp<a.maxHp);
    if(hurt.length && Math.random()<0.5){ hurt.sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp)); const tar=hurt[0];
      const amt=Math.round(atk*1.3); tar.hp=Math.min(tar.maxHp,tar.hp+amt);
      logLine(`💚 ${u.emoji} ${u.name} лечит ${tar.name} (+${amt})`,'heal');
    } else { const tar=pickTarget(enemy); if(!tar)return; const dmg=dealDmg(tar,Math.round(atk*0.7)); logLine(`⚔️ ${u.emoji} ${u.name} бьёт ${tar.name} (−${dmg})`,'hit'); }
    return;
  }
  const tar=pickTarget(enemy); if(!tar) return;
  let dmg=Math.round(atk*(0.85+Math.random()*0.3));
  let cls='hit', extra='';
  if(u.ab==='crit' && Math.random()<0.35){ dmg=Math.round(atk*2); cls='crit'; extra=' КРИТ!'; }
  if(tar.ab==='block'){ dmg=Math.round(dmg*0.65); extra+=' (блок)'; }
  dmg=dealDmg(tar,dmg);
  if(u.ab==='vamp'){ const healv=Math.round(dmg*0.4); u.hp=Math.min(u.maxHp,u.hp+healv); logLine(`🩸 ${u.emoji} ${u.name} (+${healv} HP)`,'vamp'); }
  logLine(`⚔️ ${u.emoji} ${u.name} бьёт ${tar.name} (−${dmg})${extra}`,cls);
  if(u.ab==='chain'){
    const others=enemy.filter(x=>x.hp>0 && x!==tar);
    if(others.length){ const c=others[Math.floor(Math.random()*others.length)];
      const cd=dealDmg(c,Math.round(dmg*0.5));
      logLine(`🛰️ ${u.emoji} цепной удар по ${c.name} (−${cd})`,'chain');
    }
  }
}
function showBanner(emoji,title,btn,restart){
  $('bEmoji').textContent=emoji; $('bTitle').textContent=title;
  $('bText').textContent = restart ? 'Сыграть ещё раз с чистого листа.' : '';
  $('bBtn').textContent=btn;
  $('bBtn').onclick=()=>{ $('banner').classList.add('hidden'); if(restart){ S={gold:40,wave:1,army:[],shop:freshShop()}; } else if(btn.indexOf('Следующая')>=0){ S.wave++; S.shop=freshShop(); } render(); };
  $('banner').classList.remove('hidden');
}

$('btnBattle').addEventListener('click', initBattle);
$('btnReroll').addEventListener('click', reroll);

render();
</script>
