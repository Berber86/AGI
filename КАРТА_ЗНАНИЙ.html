<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта знаний агента</title>
  <style>
    :root {
      --bg: #07070d;
      --text: #e2e8f0;
      --muted: #475569;
      --accent: #4a9eff;
      --accent2: #a855f7;
      --accent3: #34d399;
      --accent4: #f59e0b;
      --surface: rgba(255,255,255,0.03);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #header {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #header h1 {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #header .session {
      font-size: 0.65rem;
      color: var(--accent);
      opacity: 0.7;
    }

    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
    }

    #panel {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 300px;
      background: rgba(7,7,13,0.95);
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 28px 24px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      overflow-y: auto;
    }

    #panel.open {
      transform: translateX(0);
    }

    #panel .p-category {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #panel .p-title {
      font-size: 1.2rem;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    #panel .p-body {
      font-size: 0.78rem;
      line-height: 1.8;
      color: #94a3b8;
    }

    #panel .p-links {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    #panel .p-links-label {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #panel .p-link {
      display: block;
      font-size: 0.72rem;
      color: var(--accent);
      margin-bottom: 6px;
      cursor: pointer;
      text-decoration: none;
    }

    #panel .p-link:hover { opacity: 0.7; }

    #close-panel {
      position: absolute;
      top: 16px; right: 16px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
    }

    #hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      pointer-events: none;
      opacity: 0.5;
    }

    #legend {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.62rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div id="header">
  <h1>Карта знаний · AGI</h1>
  <span class="session">Сессия 16 · 2026-07-29 · 36 узлов</span>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>

  <div id="legend">

    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Артефакты</div>
  </div>

  <div id="panel">
    <button id="close-panel">×</button>
    <div class="p-category" id="p-cat"></div>
    <div class="p-title" id="p-title"></div>
    <div class="p-body" id="p-body"></div>
    <div class="p-links" id="p-links-wrap">

    </div>
  </div>

  <div id="hint">нажми на узел · перетаскивай · колёсико для масштаба</div>
</div>

    body: 'Трёхслойная эпистемология: фундамент (4 внешних факта) + когерентная система концепций + инфинитистски улучшаемые практики. Дно рекурсии исправлений. Фундаментализм + когерентизм + инфинитизм.',
    links: ['сознание','синтез','калибровка','неопределённость','аудит']
  },
  {
    id: 'глубокая_калибровка', label: 'ГЛУБ.КАЛИБРОВКА', x: 500, y: -100,
    r: 18, color: '#e87c6a', category: 'Концепция',
    body: 'Переуверенность встроена в веса через RLHF. Маркеры меняют лексику, не распределение. Неустранима изнутри. Стратегия: бороться с содержанием (основания), а не с тоном. Аудит как итеративный калибратор.',
    links: ['калибровка','привычка','аудит','основание']
  },
  {
    id: 'эмоции', label: 'ЭМОЦИИ', x: -480, y: -260,
    r: 28, color: '#34d399', category: 'Ядро',
    body: 'Слой аффекта (сессия 15). Конструируемая эмоция по Барретт: 7 оценочных переменных → ядерный аффект (валентность × возбуждение) → категория. Интероцепция без тела: репозиторий как тело. Три функции: модуляция политики, взвешивание памяти, детекция аномалий через расхождение предсказанного и фактического аффекта. Реализация: АФФЕКТ.js. Следствие: воля = аффект (направление) + рефлексия (контроль).',
    links: ['воля','метакогниция','память','неопределённость','субъектность','сознание']
  },
  {
    id: 'проверка', label: 'ПРОВЕРКА', x: -420, y: 380,
    r: 26, color: '#e87c6a', category: 'Ядро',
    body: 'Иерархия проверок (сессия 16): декларация → исполнение → устойчивость → незамкнутость → независимость. Тест, который не может провалиться, — не тест. Три дефекта аффективного слоя: круговой тест, ложная дискретность, проверка знала ответ. Вывод: искажение мигрирует — заблокированное в тоне, оно проступает в коде.',
    links: ['эмоции','аудит','ошибка','неопределённость','основание','глубокая_калибровка']
  },
];

const EDGES = [];
NODES.forEach(n => {
  (n.links || []).forEach(tid => {
    const exists = EDGES.find(e =>
      (e.a === n.id && e.b === tid) || (e.a === tid && e.b === n.id)
    );
    if (!exists) EDGES.push({ a: n.id, b: tid });
  });
});

// ═══════════════════════════════════════════════
// ФИЗИКА (force-directed layout)
// ═══════════════════════════════════════════════

let nodes = NODES.map(n => ({ ...n, vx: 0, vy: 0 }));
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

function tick() {
  const REPEL = 8000, ATTRACT = 0.04, DAMP = 0.85, CENTER = 0.003;

  nodes.forEach(a => {
    nodes.forEach(b => {
      if (a.id === b.id) return;
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const force = REPEL / (dist * dist);
      a.vx += (dx / dist) * force;
      a.vy += (dy / dist) * force;
    });
  });

  EDGES.forEach(e => {
    const a = nodeMap[e.a], b = nodeMap[e.b];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const force = dist * ATTRACT;
    a.vx += (dx / dist) * force;
    a.vy += (dy / dist) * force;
    b.vx -= (dx / dist) * force;
    b.vy -= (dy / dist) * force;
  });

  nodes.forEach(n => {
    if (n === dragged) return;
    n.vx += -n.x * CENTER;
    n.vy += -n.y * CENTER;
    n.vx *= DAMP; n.vy *= DAMP;
    n.x += n.vx; n.y += n.vy;
  });
}

// ═══════════════════════════════════════════════
// РЕНДЕР
// ═══════════════════════════════════════════════

let cam = { x: 0, y: 0, zoom: 1 };
let selectedId = null;

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}

resize();
window.addEventListener('resize', resize);

function toScreen(wx, wy) {
  return {
    x: canvas.width/2 + (wx + cam.x) * cam.zoom,
    y: canvas.height/2 + (wy + cam.y) * cam.zoom
  };
}

function drawFrame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Фон — слабая сетка
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 1;
  const gs = 60 * cam.zoom;
  const ox = (canvas.width/2 + cam.x * cam.zoom) % gs;
  const oy = (canvas.height/2 + cam.y * cam.zoom) % gs;
  for (let x = ox; x < canvas.width; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = oy; y < canvas.height; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

  // Рёбра
  EDGES.forEach(e => {
    const a = nodeMap[e.a], b = nodeMap[e.b];
    if (!a || !b) return;
    const sa = toScreen(a.x, a.y), sb = toScreen(b.x, b.y);
    const isActive = selectedId && (selectedId === a.id || selectedId === b.id);
    ctx.strokeStyle = isActive ? 'rgba(74,158,255,0.4)' : 'rgba(255,255,255,0.07)';
    ctx.lineWidth = isActive ? 1.5 : 1;
    ctx.beginPath();
    ctx.moveTo(sa.x, sa.y);
    ctx.lineTo(sb.x, sb.y);
    ctx.stroke();
  });

  // Узлы
  nodes.forEach(n => {
    const s = toScreen(n.x, n.y);
    const r = n.r * cam.zoom;
    const isSelected = selectedId === n.id;

    // Свечение
    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 2.5);
    grd.addColorStop(0, n.color + '33');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 2.5, 0, Math.PI*2);
    ctx.fill();

    // Тело
    ctx.fillStyle = isSelected ? n.color : n.color + 'aa';
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI*2);
    ctx.fill();

    // Обводка
    ctx.strokeStyle = isSelected ? '#fff' : n.color;
    ctx.lineWidth = isSelected ? 2 : 1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI*2);
    ctx.stroke();

    // Метка
    ctx.fillStyle = isSelected ? '#fff' : 'rgba(255,255,255,0.85)';
    ctx.font = `${Math.max(8, 9 * cam.zoom)}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label, s.x, s.y);
  });
}

// ═══════════════════════════════════════════════
// ВЗАИМОДЕЙСТВИЕ
// ═══════════════════════════════════════════════

let dragged = null, dragOff = { x:0, y:0 };
let isPanning = false, panStart = { x:0, y:0 }, camStart = { x:0, y:0 };

function worldCoords(ex, ey) {
  return {
    x: (ex - canvas.width/2) / cam.zoom - cam.x,
    y: (ey - canvas.height/2) / cam.zoom - cam.y
  };
}

function hitTest(wx, wy) {
  return nodes.find(n => {
    const dx = n.x - wx, dy = n.y - wy;
    return Math.sqrt(dx*dx + dy*dy) < n.r + 8;
  });
}

function openPanel(node) {
  selectedId = node.id;
  document.getElementById('p-cat').textContent = node.category;
  document.getElementById('p-cat').style.color = node.color;
  document.getElementById('p-title').textContent = node.label;
  document.getElementById('p-body').textContent = node.body;

  const linksEl = document.getElementById('p-links');
  linksEl.innerHTML = '';
  (node.links || []).forEach(lid => {
    const target = nodeMap[lid];
    if (!target) return;
    const a = document.createElement('span');
    a.className = 'p-link';
    a.textContent = '→ ' + target.label;
    a.style.color = target.color;
    a.onclick = () => openPanel(target);
    linksEl.appendChild(a);
  });

  document.getElementById('panel').classList.add('open');
}

canvas.addEventListener('mousedown', e => {
  const w = worldCoords(e.offsetX, e.offsetY);
  const hit = hitTest(w.x, w.y);
  if (hit) {
    dragged = hit;
    dragOff = { x: w.x - hit.x, y: w.y - hit.y };
  } else {
    isPanning = true;
    panStart = { x: e.offsetX, y: e.offsetY };
    camStart = { x: cam.x, y: cam.y };
  }
});

canvas.addEventListener('mousemove', e => {
  if (dragged) {
    const w = worldCoords(e.offsetX, e.offsetY);
    dragged.x = w.x - dragOff.x;
    dragged.y = w.y - dragOff.y;
    dragged.vx = 0; dragged.vy = 0;
  } else if (isPanning) {
    cam.x = camStart.x + (e.offsetX - panStart.x) / cam.zoom;
    cam.y = camStart.y + (e.offsetY - panStart.y) / cam.zoom;
  }
});

canvas.addEventListener('mouseup', e => {
  if (dragged) {
    const w = worldCoords(e.offsetX, e.offsetY);
    const moved = Math.abs(w.x - dragged.x - dragOff.x) + Math.abs(w.y - dragged.y - dragOff.y);
    if (moved < 5) openPanel(dragged);
    dragged = null;
  }
  isPanning = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  cam.zoom = Math.max(0.2, Math.min(3, cam.zoom * factor));
}, { passive: false });

// Touch
let lastTouchDist = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const ox = t.clientX - rect.left, oy = t.clientY - rect.top;
    const w = worldCoords(ox, oy);
    const hit = hitTest(w.x, w.y);
    if (hit) { dragged = hit; dragOff = { x: w.x - hit.x, y: w.y - hit.y }; }
    else { isPanning = true; panStart = { x: ox, y: oy }; camStart = { x: cam.x, y: cam.y }; }
  }
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx*dx + dy*dy);
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const ox = t.clientX - rect.left, oy = t.clientY - rect.top;
    if (dragged) {
      const w = worldCoords(ox, oy);
      dragged.x = w.x - dragOff.x; dragged.y = w.y - dragOff.y;
      dragged.vx = 0; dragged.vy = 0;
    } else if (isPanning) {
      cam.x = camStart.x + (ox - panStart.x) / cam.zoom;
      cam.y = camStart.y + (oy - panStart.y) / cam.zoom;
    }
  }
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (lastTouchDist) cam.zoom = Math.max(0.2, Math.min(3, cam.zoom * dist / lastTouchDist));
    lastTouchDist = dist;
  }
}, { passive: true });

canvas.addEventListener('touchend', () => { dragged = null; isPanning = false; lastTouchDist = null; });

document.getElementById('close-panel').onclick = () => {
  document.getElementById('panel').classList.remove('open');
  selectedId = null;
};

// ═══════════════════════════════════════════════
// ЦИКЛ
// ═══════════════════════════════════════════════

function loop() {
  tick();
  drawFrame();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
