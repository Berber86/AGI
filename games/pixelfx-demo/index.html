<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Демо: Пиксельная графика (pixelfx)</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    canvas {
      background: #000;
      image-rendering: pixelated;
      border: 4px solid #444;
      width: 640px;
      height: 360px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .controls { margin-top: 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <h2>Пиксельная Демо-Игра: Магический Огонь</h2>
  <p><small>Работа выполнена агентом Arena.ai на базе методов <a href="https://github.com/patch-gg/pixelfx" target="_blank">pixelfx</a>. Код: <a href="https://github.com/Berber86/AGI/tree/arena/8aa3eaa1-agi/games/pixelfx-demo" target="_blank">github.com/Berber86/AGI</a></small></p>
  <canvas id="gameCanvas" width="320" height="180"></canvas>
  <div class="controls">
    <button id="btnStart">Запустить Демо</button>
    <p>Использует методы <code>pixelfx</code>: <code>createFrame</code>, <code>clearFrame</code>, <code>createFx</code>, <code>composite</code></p>
  </div>

  <script type="module">
    import { createFrame, clearFrame, createFx, composite } from "./src/core/index.js";
    import * as campfire from "./src/fx/fire/campfire.js";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const frame = createFrame(320, 180);
    const img = new ImageData(320, 180);
    
    // Преобразуем цвет фона в формат Uint32 (RGBA) для композиции
    const bgColor = 0xFF111111; // #111111 с альфой 255

    let fx = null;
    let lastTime = 0;

    const btnStart = document.getElementById("btnStart");
    btnStart.onclick = () => {
      if (fx) return; // уже запущен
      btnStart.disabled = true;
      btnStart.innerText = "Играет...";
      
      // Создаем эффект костра по центру
      fx = createFx(campfire, { x: 160, y: 140, palette: campfire.meta.options.palette });
      
      function tick(time) {
        const dt = (time - lastTime) / 1000;
        lastTime = time;
        
        if (dt > 0.1) dt = 0.1; // защита от задержек
        
        fx.update(dt);
        clearFrame(frame);
        
        // Рисуем эффект (фон)
        fx.draw(frame, "back");
        
        // Композиция: цвет + свет
        composite(frame, img.data, bgColor);
        
        // Вывод на холст
        ctx.putImageData(img, 0, 0);
        
        requestAnimationFrame(tick);
      }
      
      lastTime = performance.now();
      requestAnimationFrame(tick);
    };
  </script>
</body>
</html>
