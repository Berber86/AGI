<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Мой пульт — универсальное локальное подключение второго телефона 60 Гц">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130d24"/>
      <stop offset="52%" stop-color="#182235"/>
      <stop offset="100%" stop-color="#102722"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6aa8"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#3bd67f"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.28" cy="0.52" r="0.38">
      <stop offset="0%" stop-color="#ff6aa8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ff6aa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.72" cy="0.52" r="0.38">
      <stop offset="0%" stop-color="#3bd67f" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3bd67f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glowL)"/>
  <rect width="800" height="450" fill="url(#glowR)"/>

  <!-- Direct Wi-Fi 60 Hz arcs -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M 295 215 Q 400 140 505 215" stroke-width="6" opacity="0.95"/>
    <path d="M 315 235 Q 400 178 485 235" stroke-width="4.5" opacity="0.72"/>
    <path d="M 295 255 Q 400 330 505 255" stroke-width="4" stroke-dasharray="10 10" opacity="0.65"/>
  </g>

  <!-- Center 60 Hz Wi-Fi badge -->
  <g transform="translate(400, 232)">
    <rect x="-76" y="-26" width="152" height="52" rx="26" fill="#0d1522" stroke="#ffd166" stroke-width="2.5"/>
    <text x="0" y="-2" text-anchor="middle" fill="#ffd166" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="800">ПРЯМОЙ Wi-Fi</text>
    <text x="0" y="16" text-anchor="middle" fill="#9bf2be" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">60 Гц · БЕЗ API</text>
  </g>

  <!-- Left: VR Headset Phone (Hotspot Host) -->
  <g transform="translate(175, 230)">
    <rect x="-102" y="-66" width="204" height="132" rx="22" fill="#1b1630" stroke="#f6b8d2" stroke-width="3"/>
    <line x1="0" y1="-56" x2="0" y2="56" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <!-- QR miniature -->
    <rect x="-78" y="-38" width="56" height="56" rx="8" fill="#ffffff"/>
    <path d="M-70-30h16v16h-16z M-46-30h16v16h-16z M-70-6h16v16h-16z M-50-6h8v8h-8z M-38 2h8v8h-8z" fill="#181226"/>
    <!-- Stereo lenses hint -->
    <circle cx="44" cy="-10" r="24" fill="#ff6aa8" fill-opacity="0.22" stroke="#ff6aa8" stroke-width="2.5"/>
    <circle cx="44" cy="-10" r="9" fill="#ffd166"/>
    <text x="0" y="45" text-anchor="middle" fill="#fdf3ff" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Экран в VR + Wi-Fi</text>
  </g>

  <!-- Right: Universal Controller Phone (Joystick + Wrist Beacon) -->
  <g transform="translate(625, 230)">
    <rect x="-72" y="-116" width="144" height="232" rx="24" fill="#121e2b" stroke="#7ff7d4" stroke-width="3"/>
    <!-- Top half: Candy Kingdom steer/tilt wheel -->
    <rect x="-56" y="-96" width="112" height="86" rx="14" fill="#2d143c" stroke="#ff6aa8" stroke-width="1.8"/>
    <circle cx="0" cy="-53" r="24" fill="none" stroke="#ffd166" stroke-width="4"/>
    <circle cx="0" cy="-53" r="7" fill="#ff6aa8"/>
    <!-- Bottom half: White Night dual-color wrist beacon -->
    <rect x="-56" y="2" width="112" height="86" rx="14" fill="#070b0e" stroke="#3bd67f" stroke-width="1.8"/>
    <circle cx="-24" cy="45" r="18" fill="#00ff66"/>
    <circle cx="24" cy="45" r="18" fill="#ff00aa"/>
    <text x="0" y="106" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">Автовыбор игры</text>
  </g>

  <!-- Header title -->
  <text x="400" y="56" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="900">МОЙ ПУЛЬТ · 2 ТЕЛЕФОНА</text>
  <text x="400" y="84" text-anchor="middle" fill="#cbd8ea" font-family="Segoe UI, system-ui, sans-serif" font-size="15.5" font-weight="600">Одна пара для «Сладкой Гонки» и «Белой ночи» · Авто-вход и офлайн QR ↔ QR</text>
</svg>
