<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d2e"/>
      <stop offset="0.52" stop-color="#2d1654"/>
      <stop offset="1" stop-color="#12355b"/>
    </linearGradient>
    <linearGradient id="fastBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cloudArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle radar grid -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5">
    <circle cx="400" cy="235" r="95" fill="none"/>
    <circle cx="400" cy="235" r="175" fill="none"/>
    <line x1="120" y1="235" x2="680" y2="235"/>
    <line x1="400" y1="55" x2="400" y2="395"/>
  </g>

  <!-- Cloud relay arc (Firebase ~150 ms) -->
  <path d="M 185 220 Q 400 35 615 220" fill="none" stroke="url(#cloudArc)" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>
  <rect x="302" y="54" width="196" height="40" rx="20" fill="#3b1d5e" stroke="#fbbf24" stroke-width="2"/>
  <text x="400" y="80" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#fde68a" text-anchor="middle">Firebase ~150 мс</text>

  <!-- Direct P2P beam (WebRTC ~5 ms, 60 Hz) -->
  <line x1="205" y1="262" x2="595" y2="262" stroke="url(#fastBeam)" stroke-width="10" stroke-linecap="round"/>
  <line x1="205" y1="262" x2="595" y2="262" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <rect x="282" y="282" width="236" height="44" rx="22" fill="#0f3349" stroke="#34d399" stroke-width="2.5"/>
  <text x="400" y="310" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" fill="#6ee7b7" text-anchor="middle">WebRTC P2P ~5 мс · 60 Гц</text>

  <!-- Left Phone: Joystick / Pointer -->
  <g transform="translate(88, 148)">
    <rect x="0" y="0" width="112" height="196" rx="22" fill="#24133d" stroke="#a78bfa" stroke-width="4"/>
    <rect x="10" y="18" width="92" height="150" rx="12" fill="#140926"/>
    <circle cx="56" cy="82" r="30" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="64" cy="74" r="11" fill="#34d399"/>
    <rect x="18" y="128" width="34" height="26" rx="7" fill="#ffd166"/>
    <rect x="60" y="128" width="34" height="26" rx="7" fill="#4c2878"/>
    <text x="56" y="224" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#e9d5ff" text-anchor="middle">Пульт-указка</text>
  </g>

  <!-- Right Phone: VR / Screen -->
  <g transform="translate(600, 148)">
    <rect x="0" y="0" width="112" height="196" rx="22" fill="#24133d" stroke="#34d399" stroke-width="4"/>
    <rect x="10" y="18" width="92" height="150" rx="12" fill="#0d1f33"/>
    <!-- Target + dual cursors -->
    <circle cx="58" cy="86" r="26" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle cx="40" cy="102" r="8" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="58" cy="86" r="10" fill="#34d399"/>
    <circle cx="58" cy="86" r="4" fill="#ffffff"/>
    <text x="56" y="224" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#a7f3d0" text-anchor="middle">VR-экран</text>
  </g>

  <!-- Bottom title -->
  <text x="400" y="420" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="27" font-weight="900" fill="#fdf3ff" text-anchor="middle">Стенд: Firebase против прямого WebRTC</text>
</svg>
